<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg">
      <stop stop-color="#050309"/>
      <stop offset=".5" stop-color="#17112E"/>
      <stop offset="1" stop-color="#452067"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset=".3" stop-color="#050309"/>
      <stop offset=".42" stop-color="#E8D5FF"/>
      <stop offset=".55" stop-color="#AB78E8"/>
      <stop offset="1" stop-color="#663399" stop-opacity="0"/>
    </radialGradient>

    <pattern id="stars" width="137" height="83" patternUnits="userSpaceOnUse">
      <g fill="#E8D5FF">
        <circle cx="12" cy="15" r="1" opacity=".6"/>
        <circle cx="48" cy="35" r=".7" opacity=".8"/>
        <circle cx="95" cy="18" r="1.2" opacity=".5"/>
        <circle cx="122" cy="61" r=".8" opacity=".7"/>
        <circle cx="64" cy="73" r=".6" opacity=".5"/>
        <circle cx="25" cy="57" r=".9" opacity=".4"/>
      </g>
    </pattern>

    <clipPath id="wave">
      <path d="M0 0 H1000 V230 Q750 280 500 235 T0 240 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wave)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <rect width="1000" height="260" fill="url(#stars)"/>

    <g fill="#E8D5FF">
      <circle cx="85" cy="45" r="2.5">
        <animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="875" cy="52" r="2">
        <animate attributeName="opacity" values="1;.2;1" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="245" cy="188" r="2">
        <animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <circle cx="500" cy="111" r="130" fill="url(#halo)"/>

    <g transform="rotate(-17 500 111)" fill="none" stroke="#AB78E8">
      <ellipse cx="500" cy="111" rx="85" ry="20" stroke-width="4"/>
      <ellipse cx="500" cy="111" rx="105" ry="28" stroke-width="2.5"/>
      <ellipse cx="500" cy="111" rx="125" ry="36" stroke-width="2"/>
      <ellipse cx="500" cy="111" rx="145" ry="44" stroke-width="1.5"/>
      <ellipse cx="500" cy="111" rx="165" ry="52" stroke-width="1"/>
      <ellipse cx="500" cy="111" rx="115" ry="32" stroke="#E8D5FF" stroke-width="3" stroke-dasharray="12 35">
        <animate attributeName="stroke-dashoffset" from="0" to="-94" dur="8s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <circle cx="500" cy="111" r="48" fill="#030205" stroke="#AB78E8" stroke-width="1.5"/>

    <g font-family="Verdana, Arial, sans-serif" text-anchor="middle">
      <text x="500" y="133" font-size="65" font-weight="bold" letter-spacing="8" fill="#FFFFFF" stroke="#09051C" stroke-width="1.5" paint-order="stroke">ASTHAROXS</text>
      <text x="500" y="190" font-size="18" letter-spacing="5" fill="#E8D5FF"> CODE · CREATE · EXPLORE </text>
      <text x="500" y="220" font-size="11" letter-spacing="5" fill="#AB78E8">✦ BEYOND THE EVENT HORIZON ✦</text>
    </g>
  </g>
</svg>
